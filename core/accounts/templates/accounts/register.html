<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-bg: #F0E9DE;
            --secondary-bg: #AFAE90;
            --accent: #37371B;
            --text-color: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Serif 4", serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            background-color: var(--primary-bg);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 380px;
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 48px 36px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
            color: var(--text-color);
        }

        .auth-subtitle {
            font-size: 15px;
            text-align: center;
            color: rgba(0, 0, 0, 0.6);
            margin-bottom: 36px;
            line-height: 1.6;
            font-weight: 400;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
            width: 100%;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--secondary-bg);
            border: none;
            border-radius: 8px;
            font-family: "Source Serif 4", serif;
            font-size: 16px;
            color: var(--text-color);
            transition: background-color 200ms ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: rgba(0, 0, 0, 0.5);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: 2px solid var(--accent);
            outline-offset: 0;
            background-color: #B8B79D;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0, 0, 0, 0.6);
            transition: color 200ms ease;
        }

        .password-toggle:hover {
            color: var(--accent);
        }

        .password-toggle:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--accent);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-family: "Source Serif 4", serif;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 200ms ease, transform 200ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        button[type="submit"]:hover {
            background-color: #2C2D16;
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .auth-link {
            text-align: center;
            margin-top: 24px;
            font-size: 15px;
        }

        .auth-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: color 200ms ease;
        }

        .auth-link a:hover {
            color: #2C2D16;
            text-decoration: underline;
        }

        .auth-link a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 2px;
        }

        .error {
            color: #C5320C;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            padding: 12px;
            background-color: rgba(197, 50, 12, 0.1);
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 36px 24px;
            }

            h2 {
                font-size: 24px;
                margin-bottom: 28px;
            }

            input[type="text"],
            input[type="password"],
            button[type="submit"] {
                padding: 12px 14px;
                font-size: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
            }

            button[type="submit"]:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <h2>Create Account</h2>
        <p class="auth-subtitle">Get started today and make every task count.</p>
        <form action="" method="post">
            {% csrf_token %}

            <div class="input-group">
                <input type="text" name="username" placeholder="username" required>
            </div>

            <div class="input-group password-wrapper">
                <input type="password" name="password" id="password" placeholder="password" required>
                <button type="button" class="password-toggle" onclick="togglePassword('password', this)"
                    aria-label="Toggle password visibility">
                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg class="eye-off-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    </svg>
                </button>
            </div>

            <div class="input-group password-wrapper">
                <input type="password" name="confirm_password" id="confirm_password" placeholder="confirm password"
                    required>
                <button type="button" class="password-toggle" onclick="togglePassword('confirm_password', this)"
                    aria-label="Toggle password visibility">
                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    <svg class="eye-off-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                    </svg>
                </button>
            </div>

            <button type="submit">Register</button>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>

        <div class="auth-link">
            <a href="{% url 'user_login' %}">Already have an account</a>
        </div>
    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const eyeIcon = button.querySelector('.eye-icon');
            const eyeOffIcon = button.querySelector('.eye-off-icon');

            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.style.display = 'none';
                eyeOffIcon.style.display = 'block';
            } else {
                input.type = 'password';
                eyeIcon.style.display = 'block';
                eyeOffIcon.style.display = 'none';
            }
        }
    </script>
</body>

</html>
